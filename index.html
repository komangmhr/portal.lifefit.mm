<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeFit</title>
  <meta name="description" content="LifeFit Myanmar portal — fitness, yoga, meditation, healthy cooking and mind games. Includes fixes for the LF-235 bug list.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/portal.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="logo" href="#/home"><span class="brand-mark" aria-hidden="true"></span><span>LifeFit</span></a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <button class="side-bugs" data-action="open-index"><span>Bug fixes</span><b id="bugCount">34</b></button>
      </div>
    </aside>
    <div class="main-col">
      <main id="screen" class="screen" tabindex="-1"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <aside class="bug-index" id="bugIndex" aria-label="Bug fix index">
    <div class="bi-head"><div><strong>Bug fixes · LF-235</strong><span>34 open bugs, retest 21 Oct 2026</span></div><button class="icon-btn" data-action="close-index" aria-label="Close">✕</button></div>
    <label class="bi-toggle"><span>Show bug notes on pages</span><button class="switch" role="switch" id="notesSwitch" data-action="toggle-notes" aria-label="Show bug notes"></button></label>
    <div class="bi-filter" role="group" aria-label="Filter by owner">
      <button class="chip is-active" data-owner="all">All</button><button class="chip" data-owner="CMS">CMS</button><button class="chip" data-owner="Both">CMS + Portal</button><button class="chip" data-owner="Portal">Portal</button>
    </div>
    <ol class="bug-list" id="bugList"></ol>
    <button class="link-btn" data-action="reset" style="margin:12px 0 24px">Reset demo data</button>
  </aside>
  <div class="bi-scrim" data-action="close-index"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet-root" id="sheetRoot"></div>
  <script src="assets/bugs.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
